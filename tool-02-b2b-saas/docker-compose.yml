# Tool 02 local services. Ports are fixed by /PORTS.md, so don't change them.
name: tool-02-signal-desk

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: esd
      POSTGRES_PASSWORD: esd
      POSTGRES_DB: signal_desk
    ports:
      - "5402:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esd -d signal_desk"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "4002:8025" # web inbox
      - "2502:1025" # SMTP

volumes:
  pgdata:
