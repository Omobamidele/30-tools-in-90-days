<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Enquiry Tracker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="ws"><span class="mark" id="logo">J</span><span class="nm" id="company">Wedding Enquiry Tracker</span></div>
    <label class="search"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><span class="sr">Search enquiries</span><input id="search" type="search" placeholder="Search" autocomplete="off"><kbd>/</kbd></label>
    <nav id="nav" aria-label="Main"></nav>
    <div class="me"><span class="ini" id="meIni">EL</span><span id="meName">Elena Lane</span><span class="clock" id="clock"></span></div>
  </aside>
  <main id="app" tabindex="-1"><p class="loading">Loading enquiries…</p></main>
  <aside id="drawer" class="drawer" aria-label="Enquiry details" hidden></aside>
</div>
<dialog id="addDialog" aria-labelledby="addTitle"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="src/app.js"></script>
</body>
</html>
